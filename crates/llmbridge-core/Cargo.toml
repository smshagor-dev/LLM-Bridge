[package]
name = "llmbridge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[features]
default = []
native = []
# Vendor-neutral remote model storage (HTTP/1.1 Range transport + secure local
# staging). Dependency-free (std only); off by default so default/native builds
# and the no-default-features build are unaffected.
remote = []
# Production HTTPS for the remote transport: rustls (ring provider) + the Mozilla
# root store, layered over the std TcpStream so SSRF destination-pinning and the
# strict HTTP Range validation are preserved. Off by default; the default
# inference build stays free of network/TLS dependencies.
https = ["remote", "dep:rustls", "dep:webpki-roots", "dep:rustls-pki-types"]
[dependencies]
sha2 = "=0.10.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-pki-types = { version = "1", optional = true }
webpki-roots = { version = "0.26", optional = true }

[build-dependencies]
cmake = "0.1.54"

[[example]]
name = "streamed_executor_contract"
required-features = ["native"]

[[example]]
name = "queued_streamed_contract"
required-features = ["native"]

[[example]]
name = "paused_admission_contract"
required-features = ["native"]

[[example]]
name = "model_contract"
required-features = ["native"]

[[example]]
name = "q8_two_stage"
required-features = ["native"]

[[example]]
name = "streamed_contract"
required-features = ["native"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }


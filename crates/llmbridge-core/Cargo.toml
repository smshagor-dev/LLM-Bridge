[package]
name = "llmbridge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[features]
default = []
native = []
[dependencies]
sha2 = "=0.10.9"

[build-dependencies]
cmake = "0.1.54"

[[example]]
name = "streamed_executor_contract"
required-features = ["native"]

[[example]]
name = "queued_streamed_contract"
required-features = ["native"]

[[example]]
name = "paused_admission_contract"
required-features = ["native"]

[[example]]
name = "model_contract"
required-features = ["native"]

[[example]]
name = "q8_two_stage"
required-features = ["native"]

[[example]]
name = "streamed_contract"
required-features = ["native"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

